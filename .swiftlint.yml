# swift-format owns whitespace and layout; SwiftLint checks code quality.
# Existing violations remain visible in this checked-in baseline.
baseline: .swiftlint-baseline.json
included:
  - Package.swift
  - Agent
  - Scenario
  - VisionCLI
  - Tests
  - apps
  - agents
  - Plugins
  - Scripts
excluded:
  - .tmp
  - "**/.tmp"
  - .build
  - "**/.build"
  - dist
  - "**/dist"
  - HostBuilds
  - Projects
only_rules:
  - force_cast
  - force_try
  - duplicate_imports
  - unused_optional_binding
  - unused_closure_parameter
  - empty_count
  - discouraged_direct_init
